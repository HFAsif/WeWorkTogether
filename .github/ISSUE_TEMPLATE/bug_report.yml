name: Bug report
description: Report an observable defect with reproduction steps
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: What is wrong?
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact steps and relevant versions.
      placeholder: |
        1. Open...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and evidence
      description: Attach safe logs or screenshots; remove secrets and personal data.
    validations:
      required: true
