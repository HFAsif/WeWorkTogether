name: Check Markdown links

# Run on every PR and main push. A deleted/renamed non-Markdown
# target (e.g. assets/logo.png) can break a link in an unchanged README.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Offline link checker and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run local link checker
        run: python scripts/check_md_links.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
